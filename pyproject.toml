[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "felis"
version = "0.8.0"
description = "FELIS camera trap pipeline CLI (YOLO predict, EXIF, validate, aggregate)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Gergő Oláh", email = "gerih98@gmail.com" },
  { name = "Miklós Bán", email = "banm@vocs.unideb.hu" },
  { name = "Gábor Bóné", email = "bone_gabor@yahoo.com" },
]
dependencies = [
  "exifread==3.5.1",
  "ffmpeg-python==0.2.0",
  "numpy==2.1.3",
  "opencv-python==5.0.0.93",
  "pandas==3.0.5",
  "pillow==12.3.0",
  "python-dateutil==2.9.0.post0",
  "ultralytics==8.4.143",
  "cliff==4.16.0",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
two-stage = [
  "PytorchWildlife==1.3.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
  "tensorflow==2.19.1",
  "keras==3.9.2",
  # PytorchWildlife 1.3.0 imports these but does not declare them.
  "librosa==0.11.0",
  "soundfile==0.14.0",
  # The serialized DeepFaune checkpoint needs dill during torch.load.
  "dill==0.4.1",
  # PytorchWildlife 1.3.0 imports pkg_resources through yolov5.
  "setuptools==80.10.2",
]

[project.scripts]
felis = "felis:main"

[tool.setuptools]
py-modules = ["felis"]

[tool.setuptools.packages.find]
include = ["felis_cli*"]
